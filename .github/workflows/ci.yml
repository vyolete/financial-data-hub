name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only token; no job needs secrets or calls the external data APIs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.13"
          enable-cache: false
      - name: Visible failure on demand
        # An empty commit whose message contains the marker shows that failures are visible.
        if: ${{ contains(github.event.head_commit.message, '[ci-fail-demo]') }}
        run: |
          echo "::error::Intentional failure requested by [ci-fail-demo]"
          exit 1
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify portal declarations against OpenAPI
        env:
          FDH_API_PYTHON: ../backend/.venv/bin/python
        run: npm --prefix ../frontend run api:check
      - name: Tests without network or database
        run: >
          uv run pytest tests/unit tests/contract tests/architecture
          tests/api/test_health.py tests/api/test_errors.py tests/api/test_openapi_contract.py
          --cov=fdh.domain --cov=fdh.dataplane --cov-fail-under=85

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
        env:
          POSTGRES_USER: fdh
          POSTGRES_DB: fdh
          # Throwaway database reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fdh"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.13"
          enable-cache: false
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest tests/integration tests/api

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a throwaway environment file
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
      - name: Check exposure and configuration mounts
        run: docker compose config --format json | python3 scripts/check_compose.py
      - run: docker compose up --detach --build --wait --wait-timeout 300
      - run: ./scripts/smoke.sh
      - run: docker compose run --rm api fdh config check
      - run: docker compose run --rm api fdh sources sync
      - name: Data survives a restart
        run: |
          docker compose restart db
          docker compose up --detach --wait --wait-timeout 120
          docker compose exec -T db psql -U fdh -d fdh -Atc "select count(*) from sources" | grep -qx 2
      - name: Seed the disposable Compose catalog
        run: docker compose exec -T api python - < backend/tests/fixtures/synthetic/seed.py
      - name: Seeded catalog smoke
        run: FDH_EXPECT_SYNTHETIC=1 ./scripts/smoke.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node --test scripts/browser_check.test.mjs
      - name: Verify the portal in Chrome
        env:
          FDH_CHROME_NO_SANDBOX: "1"
        run: |
          chrome="$(command -v google-chrome)"
          printf 'Chrome executable: %s (resolved: %s)\n' "$chrome" "$(readlink -f "$chrome")"
          "$chrome" --version
          CHROME_BIN="$chrome" node scripts/browser_check.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Remove the environment
        if: always()
        run: docker compose down --volumes

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Search the whole history for secrets
        run: >
          docker run --rm --network none -v "$PWD:/repo:ro"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1
