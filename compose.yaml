# Local development only. Services are published on the loopback interface.
name: financial-data-hub

x-backend: &backend
  build: ./backend
  image: fdh-backend:local
  environment:
    FDH_DB_HOST: db
    FDH_DB_PORT: "5432"
    FDH_DB_NAME: fdh
    FDH_DB_USER: fdh
    FDH_DB_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in .env}
    FDH_CONFIG: /app/config/sources.toml
    FDH_API_ALLOWED_HOSTS: 127.0.0.1,localhost
  volumes:
    - ./config:/app/config:ro
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b
    environment:
      POSTGRES_DB: fdh
      POSTGRES_USER: fdh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${FDH_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "fdh", "-d", "fdh"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${FDH_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./frontend
    image: fdh-web:local
    ports:
      - "127.0.0.1:${FDH_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
